
name: Extract ZIP Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/extracted
          unzip -oq "$ZIP_FILE" -d /tmp/extracted

          if [ "$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
             [ -d "$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE_DIR=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          else
            SOURCE_DIR=/tmp/extracted
          fi

          rsync -a \
            --exclude='/.github/' \
            --exclude='/.git/' \
            "$SOURCE_DIR"/ ./

      - name: Commit extracted files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project from ZIP"
          git push
